apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: green-ai-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: green.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: green-ai-service
                port:
                  number: 80
