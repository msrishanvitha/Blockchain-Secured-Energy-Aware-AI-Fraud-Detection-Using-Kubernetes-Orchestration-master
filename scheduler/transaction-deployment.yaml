apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  labels:
    app: transaction-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
      - name: transaction-service
        image: suchitha20/transaction-service:v1
        ports:
        - containerPort: 7200
        env:
        - name: BLOCKCHAIN_URL
          value: "http://blockchain-0.blockchain.default.svc.cluster.local:7000"
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
spec:
  selector:
    app: transaction-service
  ports:
  - protocol: TCP
    port: 7200
    targetPort: 7200
