apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: green-scheduler-role
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: green-scheduler-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: default
  namespace: default
roleRef:
  kind: Role
  name: green-scheduler-role
  apiGroup: rbac.authorization.k8s.io
