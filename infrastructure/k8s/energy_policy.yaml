apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: energypolicies.scheduling.greenai.dev
spec:
  group: scheduling.greenai.dev
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                minGreenScore:
                  type: number
                  minimum: 0
                  maximum: 1
                splitThreshold:
                  type: number
                  minimum: 0
                  maximum: 1
  scope: Namespaced
  names:
    plural: energypolicies
    singular: energypolicy
    kind: EnergyPolicy
